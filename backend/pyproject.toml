[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=14,<18", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
